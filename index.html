<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Íconos: el cohete del logo sobre el negro de la marca. El sitio no
         tenía ninguno, así que la pestaña mostraba el ícono genérico. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>LTWEB — Diseño y desarrollo web en Buenos Aires</title>
    <meta
      name="description"
      content="Estudio de diseño y desarrollo web. Hacemos sitios institucionales, landing pages, tiendas online y sistemas de gestión a medida para empresas."
    />
    <link rel="canonical" href="https://ltweb.com.ar" />

    <!-- Estas son las etiquetas por defecto; cada ruta las reescribe con las
         suyas desde src/lib/seo.js. La imagen es la que ven WhatsApp,
         Instagram y demás al compartir un link. -->
    <meta property="og:site_name" content="LTWEB" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="LTWEB — Diseño y desarrollo web en Buenos Aires" />
    <meta
      property="og:description"
      content="Estudio de diseño y desarrollo web. Sitios institucionales, tiendas online y sistemas de gestión a medida."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ltweb.com.ar" />
    <meta property="og:image" content="https://ltweb.com.ar/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://ltweb.com.ar/og-image.jpg" />
    <meta name="theme-color" content="#111113" />

    <!-- Acá se precargaba bg-6.webp con prioridad alta. Se sacó: esa imagen
         es el fondo del hero ANTERIOR, que hoy solo vive en /clasico. En la
         home actual no se muestra nunca, así que eran 60 KB bajados con la
         máxima prioridad en cada visita, compitiendo por ancho de banda con
         las imágenes que sí se ven. -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Solo los pesos que el sitio realmente usa. Antes se pedían 14 (Phudu
         hasta 900, y 700 de las otras dos) y ninguno de esos cuatro aparece en
         el código.

         La hoja se carga sin bloquear el render: el truco de media="print" +
         onload hace que el navegador la baje en paralelo y la aplique al
         terminar, en vez de frenar la primera pintura esperando a un dominio
         de terceros. Con display=swap el texto ya aparecía primero en la
         tipografía de sistema, así que no se agrega ningún parpadeo nuevo. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Phudu:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&family=Poppins:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Phudu:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&family=Poppins:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Phudu:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&family=Poppins:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      />
    </noscript>
    <!-- Datos estructurados de la empresa. Van en el HTML y no inyectados por
         React a propósito: es la información que identifica al negocio ante
         Google y así está presente aunque el buscador no ejecute el JS. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "ProfessionalService",
            "@id": "https://ltweb.com.ar/#estudio",
            "name": "LTWEB",
            "description": "Estudio de diseño y desarrollo web. Sitios institucionales, landing pages, tiendas online y sistemas de gestión a medida.",
            "url": "https://ltweb.com.ar",
            "image": "https://ltweb.com.ar/og-image.jpg",
            "logo": "https://ltweb.com.ar/icon-512.png",
            "email": "ltwebs.studio@gmail.com",
            "telephone": "+541159532487",
            "priceRange": "$$",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Buenos Aires",
              "addressCountry": "AR"
            },
            "areaServed": { "@type": "Country", "name": "Argentina" },
            "knowsLanguage": "es-AR",
            "sameAs": [
              "https://www.instagram.com/ltweb.ar/",
              "https://www.tiktok.com/@ltweb__"
            ],
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "Servicios",
              "itemListElement": [
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Diseño y rediseño web",
                    "description": "Sitios institucionales, landing pages y experiencias responsive."
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "E-commerce",
                    "description": "Tiendas online preparadas para facilitar cada etapa de la compra."
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Desarrollo y soluciones personalizadas",
                    "description": "Sistemas a medida, integraciones y automatizaciones."
                  }
                }
              ]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://ltweb.com.ar/#sitio",
            "url": "https://ltweb.com.ar",
            "name": "LTWEB",
            "inLanguage": "es-AR",
            "publisher": { "@id": "https://ltweb.com.ar/#estudio" }
          }
        ]
      }
    </script>

    <!-- Proyectos publicados desde el panel.

         Va acá arriba, sin defer ni module, para que se ejecute antes que el
         bundle: cuando React arranca, los proyectos ya están en memoria. Eso
         evita el pedido de red, la pantalla de carga y el salto de maqueta que
         había cuando llegaban después.

         El archivo se llama siempre igual, así que para que publicar se vea
         al instante lleva Cache-Control no-cache desde el .htaccess. Sin eso
         quedaba atrapado en la regla que cachea todo .js por un año. -->
    <script src="/data/projects.js"></script>

    <!-- Precarga de las primeras portadas del muro.

         Estas imágenes las dibuja React, así que el navegador se entera de que
         existen recién cuando bajó, parseó y ejecutó todo el JavaScript. Hasta
         ese momento la conexión está ociosa. Una de ellas es el elemento más
         grande de la primera pantalla, o sea la que define el LCP.

         Acá se piden apenas se leen los datos —que ya están en memoria por el
         script de arriba, sin ningún pedido de red—, o sea unos cientos de
         milisegundos antes.

         Van solo tres: precargar las doce sería peor, porque compiten entre
         ellas y las tres primeras tardarían más en llegar. -->
    <script>
      (function () {
        try {
          var d = window.__LTWEB_DATOS__
          if (!d || !d.proyectos) return

          /* Misma regla que src/lib/imagen.js: el muro usa la copia chica. */
          function chica(u) {
            if (!u) return u
            if (u.indexOf('/images/pf-') === 0) return u.replace('/images/', '/images/muro/')
            if (u.indexOf('/subidas/') === 0 && u.slice(-5) === '.webp') return u.slice(0, -5) + '-672.webp'
            return u
          }

          d.proyectos
            .filter(function (p) { return p.image })
            .slice(0, 3)
            .forEach(function (p) {
              var l = document.createElement('link')
              l.rel = 'preload'
              l.as = 'image'
              l.href = chica(p.image)
              l.fetchPriority = 'high'
              document.head.appendChild(l)
            })
        } catch (e) {
          /* Si algo falla, el sitio carga igual: esto solo adelanta pedidos. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
