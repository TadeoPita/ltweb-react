# Construye el sitio y lo sube a Hostinger por FTP.
#
# POR QUE HACE FALTA ESTO Y NO ALCANZA EL "Git" DE hPANEL
#
# El deploy por Git de Hostinger clona el repositorio y deja los archivos tal
# cual. Eso sirve para un sitio de HTML sueltos, pero esto es una app de Vite:
# lo que el navegador tiene que recibir es el resultado de `npm run build`, no
# el codigo fuente. Y el hosting compartido no corre Node, asi que no lo puede
# construir el solo. Alguien tiene que compilar antes: o vos a mano, o esto.
#
# Se dispara con cada push a main, igual que venias trabajando.

name: Deploy a Hostinger

on:
  push:
    branches: [main]
  # Tambien se puede lanzar a mano desde la pestaña Actions de GitHub.
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # npm ci y no npm install: instala exactamente lo que dice
      # package-lock.json. Con install, una dependencia podria subir de version
      # sola entre un deploy y el siguiente y romper el build sin que nadie
      # haya tocado nada.
      - name: Instalar dependencias
        run: npm ci

      - name: Construir
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # ---------------------------------------------------------------------
      # Subida.
      #
      # El detalle importante son las exclusiones. Esta accion sincroniza: lo
      # que esta en el servidor y no en dist/ lo BORRA. Sin las tres lineas de
      # abajo, cada deploy se llevaria puestos:
      #
      #   - uploads/         todas las imagenes cargadas desde el panel
      #   - data/projects.js el contenido publicado (y peor: dist/ trae el
      #                      marcador de posicion, asi que no solo lo borraria,
      #                      lo reemplazaria por el archivo vacio)
      #   - admin.php y admin/  el panel entero, que no vive en dist/
      #
      # O sea que un push cualquiera dejaria el sitio sin proyectos y sin
      # panel. Por eso van excluidos: son cosas del servidor, no del build.
      # ---------------------------------------------------------------------
      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVIDOR }}
          username: ${{ secrets.FTP_USUARIO }}
          password: ${{ secrets.FTP_CLAVE }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_CARPETA }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            uploads/**
            data/**
            admin.php
            admin/**
            crear-usuario.php
